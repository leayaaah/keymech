spring:
  application:
    name: keymech
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema chỉ sửa ở database/01-schema.sql
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: gemini-3.5-flash-lite
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
      mariadb:
        initialize-schema: false
        distance-type: COSINE
        dimensions: 768

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  chatbot:
    mode: ${APP_CHATBOT_MODE:ai}   # ai | rule
    personalization: true
    timeout-seconds: 8
    rate-limit-per-minute: 10
    rate-limit-per-hour-global: 200
